name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build AuthId plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      # 构建依赖：AuthMe fork（公共仓库，固定 tag）
      # 先 mvn install 到本地 Maven 仓库（~/.m2），
      # 插件 build.gradle 中的 mavenLocal() + fr.xephi:authme:5.7.0-FORK 即可解析
      - name: Checkout AuthMeReReloaded fork
        uses: actions/checkout@v4
        with:
          repository: NoobLLiu/AuthMeReReloaded
          ref: v5.7.0-FORK-web.1
          path: authme-fork

      # 同一个 JDK 21 同时服务 Maven（fork 要求 >=17）与 Gradle（插件要求 21）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-authme-${{ 'v5.7.0-FORK-web.1' }}
          restore-keys: maven-authme-

      - name: Build & install AuthMe fork
        run: mvn -B install -DskipTests -Dmaven.javadoc.skip=true
        working-directory: authme-fork

      # 仓库无 Gradle wrapper，用官方 action 安装固定版本 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Build plugin
        run: gradle build --no-daemon
        working-directory: authid

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AuthId-${{ github.sha }}
          path: authid/build/libs/*.jar
          if-no-files-found: error
